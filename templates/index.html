<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }
        .menu-container {
            text-align: center;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .menu-container a {
            display: block;
            padding: 15px;
            margin: 10px 0;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .menu-container a:hover {
            background-color: #2980b9;
        }
        /* Estilo do Header */
        header {
            background-color: #2754b9;
            color: #212529;
            height: 150px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0 20px;
            
            margin-bottom: 20px;
            justify-content: space-between;
        }
        header img {
            height: 100px; /* Ajuste a altura do logotipo */
        }
        .nav {
            display: flex;
            gap: 15px;
        }
        .nav a {
            color: #212529;
            text-decoration: none;
            font-size: 18px;
        }
        .nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <img src="{{ url_for('static', filename='IMAGEM.jpg') }}" alt="GOVSESexit
            ">
        </div>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/agendar">Agendar Sala</a>
            <a href="/equipamentos">Equipamentos</a>
            <a href="/agenda">Agenda</a>
        </nav>
    </header>
    
    <div class="menu-container">
        <h1>Menu Principal</h1>
        <a href="/agendar">Agendar Sala</a>
        <a href="/equipamentos">Equipamentos</a>
        <a href="/agenda">Agenda</a>
    </div>
</body>
</html>
